<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یه سؤال کوچیک...</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#40204f,#170f22 60%,#0c0912);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(430px,100%);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);border-radius:28px;padding:30px 22px;box-shadow:0 20px 70px rgba(0,0,0,.35);text-align:center}
.heart{font-size:48px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
h1{font-size:27px;margin:12px 0}p{color:#ddd;line-height:1.9}.buttons{display:flex;gap:12px;justify-content:center;position:relative;min-height:58px;margin-top:20px}
button{border:0;border-radius:16px;padding:14px 24px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
.yes{background:#fff;color:#24132d}.no{background:rgba(255,255,255,.12);color:#fff;position:relative}.yes:hover{transform:scale(1.04)}
.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.option{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.15);width:100%}.option.selected{background:#fff;color:#24132d}
.next{width:100%;margin-top:20px;background:#dca8ff;color:#24132d}.small{font-size:12px;color:#aaa;margin-top:18px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff2a;background:#ffffff10;color:#fff;font-size:15px;text-align:center;margin-top:10px}
#msg{min-height:25px;color:#ffc7ed}
</style>
</head>
<body>
<div class="card">
  <div class="heart">♥</div>
  <div id="step1">
    <h1>یه سؤال کوچیک دارم...</h1>
    <p>با من میای سر قرار؟ 😌</p>
    <div class="buttons">
      <button class="yes" onclick="go(2)">آره، بریم 🤝</button>
      <button class="no" id="noBtn" onclick="nope()">نه 🙃</button>
    </div>
    <div id="msg"></div>
  </div>

  <div id="step2" class="hidden">
    <h1>پس بریم سر اصل مطلب 😏</h1>
    <p>چه روزی بیشتر بهت می‌چسبه؟</p>
    <div class="grid" id="dates"></div>
    <button class="next" onclick="go(3)">بعدی →</button>
  </div>

  <div id="step3" class="hidden">
    <h1>ساعتش چی؟ ⏰</h1>
    <div class="grid" id="times"></div>
    <button class="next" onclick="go(4)">بعدی →</button>
  </div>

  <div id="step4" class="hidden">
    <h1>قرار رو چجوری بریم؟</h1>
    <div class="grid" id="types"></div>
    <button class="next" onclick="finish()">ثبت قرار ❤️</button>
  </div>

  <div id="step5" class="hidden">
    <div class="heart">🥂</div>
    <h1>پس قرارمون ثبت شد!</h1>
    <p id="summary"></p>
    <p>حالا دیگه فرار ممنوعه 😂🤝</p>
    <div class="small">این صفحه رو می‌تونی ببندی.</div>
  </div>
</div>

<script>
const answers={yes:true,date:"",time:"",type:""};
let noCount=0;

function nope(){
  noCount++;
  const b=document.getElementById("noBtn"), m=document.getElementById("msg");
  const texts=["مطمئنی؟ 😂","فکر کنم اشتباه زدی 😌","دوباره امتحان کن 🤝","این گزینه فعلاً غیرفعاله 😂"];
  m.textContent=texts[Math.min(noCount-1,texts.length-1)];
  b.style.transform=`translate(${Math.random()*90-45}px,${Math.random()*35-17}px)`;
  setTimeout(()=>b.style.transform="",300);
}
function go(n){
  for(let i=1;i<=5;i++) document.getElementById("step"+i).classList.toggle("hidden",i!==n);
}
function makeOptions(id,items,key){
  const el=document.getElementById(id);
  items.forEach(x=>{
    const b=document.createElement("button"); b.className="option"; b.textContent=x;
    b.onclick=()=>{ answers[key]=x; [...el.children].forEach(z=>z.classList.remove("selected")); b.classList.add("selected"); };
    el.appendChild(b);
  });
}
makeOptions("dates",["امشب","فردا","این هفته","هفته بعد"],"date");
makeOptions("times",["عصر","اوایل شب","آخر شب","هر ساعتی تو بگی"],"time");
makeOptions("types",["☕ کافه","🍽️ شام","🚶‍♂️ یه دور بیرون","🎲 سورپرایز با تو"],"type");

function finish(){
  if(!answers.date||!answers.time||!answers.type){alert("یه گزینه از هر بخش انتخاب کن 😄");return;}
  document.getElementById("summary").textContent=`انتخابت: ${answers.date}، ${answers.time}، ${answers.type}`;
  go(5);
  // برای ثبت آنلاین، URL زیر را با Webhook خودت عوض کن.
  // این نسخه بدون سرور هم کار می‌کند؛ برای دریافت خودکار جواب‌ها، طبق README عمل کن.
  try{
    localStorage.setItem("dateInviteAnswer",JSON.stringify({...answers,submittedAt:new Date().toISOString()}));
  }catch(e){}
}
</script>
</body>
</html>
